name: Validate quotes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate quotes.json
        run: node scripts/validate.mjs
      - name: Check version bump
        if: github.event_name == 'push'
        run: node scripts/check-version-bump.mjs "${{ github.event.before }}"
